apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp025-api
  labels:
    app: mp025-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp025-api
  template:
    metadata:
      labels:
        app: mp025-api
    spec:
      containers:
        - name: mp025-api
          image: mp025-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
